# Bitstamp v2. Frames: {"event": "trade"|"data"|"bts:...", "channel": "live_trades_btcusd", "data": {...}}.
# The symbol is the end of the channel name, in lowercase.
exchange: bitstamp
venue_id: 50
connect:
  url: wss://ws.bitstamp.net
  wrapper: { stream: channel, data: data, type: event }   # event tells data frames from subscription acks
  subscribe:                                        # one message per channel per symbol
    - { event: "bts:subscribe", data: { channel: "{stream}" } }
  symbol_case: lower                                # btcusd
streams:
  - name: "live_trades_{symbol}"                    # symbol at the end, not the start
    match: trade
    message: Trade
    fields:
      ExchangeTs: microtimestamp@us                 # a string of digits
      Price:      price_str
      Qty:        amount_str
      TradeId:    id
      Aggressor:  type@bitstamp_type                # 0 = buy, 1 = sell
  - name: "order_book_{symbol}"                     # the full top 100 every event
    match: data
    book: snapshot_only
    fields: { bids: bids, asks: asks, ExchangeTs: microtimestamp@us }
