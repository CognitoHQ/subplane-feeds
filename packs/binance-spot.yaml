# Binance spot, public market data. Combined streams over one connection:
# every frame is {"stream": "<symbol>@<kind>", "data": {...}}.
# The *.binance.vision hosts serve market data only and are not geo-restricted;
# stream.binance.com / api.binance.com answer HTTP 451 from restricted locations.
exchange: binance-spot
venue_id: 10
connect:
  url: wss://data-stream.binance.vision/stream
  wrapper: { stream: stream, data: data }
  subscribe: { method: SUBSCRIBE, params: "{streams}", id: 1 }
  symbol_case: lower                 # stream names are lowercase; payload "s" is uppercase
  reconnect_before_s: 82800          # Binance closes a connection at 24 h; leave early
streams:
  - name: "{symbol}@trade"
    message: Trade
    fields:
      ExchangeTs: T@ms
      Price:      p
      Qty:        q
      TradeId:    t
      Aggressor:  m@taker_from_maker_bool   # m = buyer is the maker, so the seller aggressed
  - name: "{symbol}@bookTicker"
    message: Quote
    fields: { BidPx: b, BidQty: B, AskPx: a, AskQty: A }
  - name: "{symbol}@depth@100ms"
    book: binance_diff
    fields: { first_id: U, last_id: u, bids: b, asks: a, ExchangeTs: E@ms }
    snapshot:
      url: "https://data-api.binance.vision/api/v3/depth?symbol={SYMBOL}&limit=1000"
      fields: { last_id: lastUpdateId, bids: bids, asks: asks }
