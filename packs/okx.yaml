# OKX, public v5. Frames: {"arg": {"channel": ..., "instId": ...}, "data": [ {...} ]}. Text "ping"/"pong" keeps the socket open.
exchange: okx
venue_id: 40
connect:
  url: wss://ws.okx.com:8443/ws/v5/public
  route: { type: arg.channel, symbol: $.arg.instId }    # the symbol is on the frame, records are under each: data
  subscribe: { op: subscribe, args: "{streams}" }        # streams are objects here: {channel, instId}
  stream_object: { channel: "{channel}", instId: "{SYMBOL}" }
  ping: { text: ping, every_s: 20, reply: pong }         # text ping/pong, not WebSocket ping frames
  symbol_case: upper                                     # BTC-USDT
streams:
  - name: "{symbol}@trades"
    match: trades
    each: data
    message: Trade
    fields:
      ExchangeTs: ts@ms                                  # a string "1629386781174"
      Price:      px
      Qty:        sz
      TradeId:    tradeId
      Aggressor:  side@side
  - name: "{symbol}@tickers"
    match: tickers
    each: data
    message: Quote
    fields: { ExchangeTs: ts@ms, BidPx: bidPx, BidQty: bidSz, AskPx: askPx, AskQty: askSz }
  # Not yet: the books channel chains frames by seqId/prevSeqId with a snapshot|update action on the
  # frame and a checksum; that needs an `okx_seq` strategy (see docs/pack-format.md, still missing).
  # - name: "{symbol}@books"
  #   match: books
  #   each: data
  #   book: okx_seq
  #   fields: { action: $.action, bids: bids, asks: asks, seq_id: seqId, prev_seq_id: prevSeqId, ExchangeTs: ts@ms }
