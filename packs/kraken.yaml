# Kraken spot, WebSocket v2. Frames: {"channel": ..., "type": "snapshot"|"update", "data": [ {...}, ... ]}.
# Numbers are JSON numbers, timestamps RFC 3339, several records per frame, the symbol inside each record.
exchange: kraken
venue_id: 30
connect:
  url: wss://ws.kraken.com/v2
  route: { type: channel, symbol: symbol }          # symbol resolves per record (each: data)
  subscribe:                                        # one subscribe message per channel
    - { method: subscribe, params: { channel: trade, symbol: "{symbols}" } }
    - { method: subscribe, params: { channel: ticker, symbol: "{symbols}" } }
    - { method: subscribe, params: { channel: book, symbol: "{symbols}", depth: 25 } }
  symbol_case: upper                                # BTC/USD
streams:
  - name: "{symbol}@trade"
    match: trade
    each: data                                      # one Trade per element of the data array
    message: Trade
    fields:
      ExchangeTs: timestamp@iso8601
      Price:      price                             # JSON number, not a string
      Qty:        qty
      TradeId:    trade_id
      Aggressor:  side@side
  - name: "{symbol}@ticker"
    match: ticker
    each: data
    message: Quote
    fields: { BidPx: bid, BidQty: bid_qty, AskPx: ask, AskQty: ask_qty }
  - name: "{symbol}@book"
    match: book
    each: data
    book: l2_inband                                 # snapshot then updates; the CRC32 checksum is not verified yet
    fields:
      kind: $.type                                  # snapshot | update, on the frame
      bids: bids@objects                            # [{price, qty}]
      asks: asks@objects
      ExchangeTs: timestamp@iso8601                 # updates only
