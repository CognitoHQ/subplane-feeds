# Coinbase Exchange, public market data feed. No wrapper: every frame is a flat object
# whose "type" names the channel and whose "product_id" names the instrument.
exchange: coinbase
venue_id: 20
connect:
  url: wss://ws-feed.exchange.coinbase.com
  route: { type: type, symbol: product_id }         # frame routing by fields, not by stream name
  subscribe: { type: subscribe, product_ids: "{symbols}", channels: [matches, ticker, level2_batch] }
  symbol_case: upper                                # BTC-USD
streams:
  - name: "{symbol}@match"
    match: [match, last_match]                      # last_match: the first frame after subscribing
    message: Trade
    fields:
      ExchangeTs: time@iso8601                      # "2014-11-07T08:19:27.028459Z"
      Price:      price
      Qty:        size
      TradeId:    trade_id
      Aggressor:  side@taker_from_maker_side        # side is the maker's side; the taker aggressed
  - name: "{symbol}@ticker"
    match: ticker
    message: Quote
    fields:
      ExchangeTs: time@iso8601
      BidPx:  best_bid
      BidQty: best_bid_size
      AskPx:  best_ask
      AskQty: best_ask_size
  - name: "{symbol}@level2"
    match: [snapshot, l2update]                     # one stream, two frame types
    book: l2_inband                                 # snapshot on the socket, then absolute-size changes
    max_levels: 65536                               # level2_batch is the whole book: tens of thousands of levels a side
    fields:
      bids: bids                                    # snapshot: [price, size] pairs
      asks: asks
      changes: changes@side_pairs                   # l2update: [side, price, size]
      ExchangeTs: time@iso8601                      # absent on snapshots
