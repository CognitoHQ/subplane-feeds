name: ci
on: [push, pull_request]
jobs:
  build-2604-gcc16:
    runs-on: ubuntu-latest
    # The base of docker/Dockerfile; scripts/dev.sh runs the same deps script locally.
    container: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: scripts/deps-2604.sh
      - name: build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"$(nproc)"
      - name: test
        run: cd build && ctest --output-on-failure
