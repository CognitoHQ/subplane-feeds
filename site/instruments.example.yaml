# Venue symbol -> InstrumentId. Ids are the apps' filter keys: keep them stable.
# `partition: n` puts an instrument on partition n of the gateway's topic (default 1);
# a gateway run with `--topic T --partition n` publishes only partition n's.
instruments:
  BTCUSDT: { id: 1, base: BTC, quote: USDT }
  ETHUSDT: { id: 2, base: ETH, quote: USDT }
  SOLUSDT: { id: 3, base: SOL, quote: USDT }
